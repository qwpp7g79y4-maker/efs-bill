[package]
name = "efs-bill"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["PEPAI <pep_ai@icloud.com>"]
license = "MIT OR Apache-2.0"
description = "Offline estimate of AWS EFS Standard/IA GB-month cost from local JSON exports"
readme = "README.md"
repository = "https://github.com/qwpp7g79y4-maker/efs-bill"
homepage = "https://github.com/qwpp7g79y4-maker/efs-bill"
documentation = "https://github.com/qwpp7g79y4-maker/efs-bill"
keywords = ["aws", "efs", "cost", "cli"]
categories = ["command-line-utilities"]
exclude = ["task.md", ".github/"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rust_decimal = "1.43.0"
serde_json = { version = "1", features = ["arbitrary_precision"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
